# Run in CI (ci.yml, lint job) and locally after `uv run pre-commit install`.
repos:
  - repo: local
    hooks:
      # Docstrings state the contract; deployment and incident detail lives in docs/adr and
      # CHANGELOG.md (CONTRIBUTING.md). The lookahead admits one string: `GenRequest.label`'s
      # default value is public behaviour until 1.0 renames it.
      - id: no-deployment-vocabulary
        name: no deployment vocabulary in the package
        language: pygrep
        entry: 'EDGE|edge-host|\bbox[_-](?!chat")|Tradier|trade[-_.]data|narrator|\b\d+B\b|20\d\d-\d\d-\d\d'
        files: ^src/llm_ports/
        types: [python]
