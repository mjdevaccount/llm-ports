# Publishing. Two triggers, one pipeline, one index:
#
#   push of a `v*` tag   ci (the whole gate, reused) -> build X.Y.Z -> PyPI
#                                                              -> GitHub release with dist/* attached
#                        ci's docs site (built strict)          -> GitHub Pages
#   workflow_dispatch    ci -> build a PEP 440 dev release -> PyPI
#
# The dispatch build is `X.Y.Z.devN` (N = this workflow's run number): pyproject's version when it is
# already a dev version, else the next patch (0.12.0 -> 0.12.1.devN). Installers skip pre-releases
# unless asked (`pip install --pre`), so a dev upload is the end-to-end dry run of a real release.
#
# Uploads use PyPI trusted publishing: GitHub's OIDC token is exchanged for a short-lived upload
# token, so no secret is stored. PyPI's publisher names this repo, this file and the `pypi`
# environment; renaming any of the three breaks publishing.
#
# The GitHub release does NOT depend on the PyPI upload: consumers pin the wheel URL
#   llm-ports @ https://github.com/mjdevaccount/llm-ports/releases/download/vX.Y.Z/llm_ports-X.Y.Z-py3-none-any.whl
# and that asset must exist for every tag whatever the index did. A tag that does not match
# pyproject's version publishes nothing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    name: ci
    permissions:
      contents: read
      id-token: write # ci.yml's Codecov upload
      pull-requests: read # ci-kit gitleaks
    # A job-level reusable workflow resolves from this commit, never the runner's filesystem; the
    # `$/` self-repository form is not yet parsed by actionlint 1.7.12.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  build:
    name: build
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false # a release builds from a clean resolve, never a shared cache
      - name: tag matches pyproject version
        if: github.event_name == 'push'
        run: |
          v=$(uv version --short)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != pyproject v$v"; exit 1; }
      - name: dev version
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$(uv version --short)" in
            *.dev*) uv version --frozen --bump "dev=$GITHUB_RUN_NUMBER" ;;
            *) uv version --frozen --bump patch --bump "dev=$GITHUB_RUN_NUMBER" ;;
          esac
      - run: uv build --no-sources
      - name: twine check
        run: uv run --frozen --only-group lint twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: publish (PyPI)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/llm-ports/
    permissions:
      id-token: write # trusted publishing; the action also uploads PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # twine uploads one file at a time, so a refusal mid-way leaves a half-published version:
      # v1.18.0's wheel landed and its sdist got a 400 from PyPI's own attestation check ("Failed
      # to refresh TUF"). Without skip-existing a rerun of this job dies on the wheel's "File
      # already exists" before it reaches the missing file. With it, the rerun uploads only what is
      # missing. PyPI never lets a filename be uploaded twice, so nothing published gets replaced.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
      # skip-existing turns "already there" into success, so check the outcome itself: every file
      # built for this version must be listed on PyPI, or this job stays red until a rerun fills it.
      - name: PyPI lists every built file
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=(dist/*.whl dist/*.tar.gz)
          want=$(printf '%s\n' "${built[@]#dist/}" | sort)
          v=$(sed -E 's#^dist/[^-]+-([^-]+)-.*#\1#' <<<"${built[0]}")
          for _ in $(seq 1 12); do
            have=$(curl -fsS "https://pypi.org/pypi/llm-ports/$v/json" | jq -r '.urls[].filename' | sort || true)
            missing=$(comm -23 <(echo "$want") <(echo "$have"))
            [ -z "$missing" ] && { echo "PyPI lists all of: $(tr '\n' ' ' <<<"$want")"; exit 0; }
            sleep 10
          done
          echo "::error::PyPI is missing $(tr '\n' ' ' <<<"$missing") for $v -- rerun this job (skip-existing uploads only the missing files)"
          exit 1

  github-release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: build # never on `pypi`: the wheel URL consumers pin must exist whatever the index did
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A PEP 440 pre-release (vX.Y.ZaN / bN / rcN) is a GitHub pre-release, never "latest".
          pre=()
          case "$GITHUB_REF_NAME" in *a[0-9]* | *b[0-9]* | *rc[0-9]*) pre=(--prerelease --latest=false) ;; esac
          # no --clobber fallback: a published wheel's bytes are what consumers locked a hash of
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes "${pre[@]}"

  pages:
    name: docs site (GitHub Pages)
    if: github.event_name == 'push'
    needs: ci # ci's `docs` job built the site strict and uploaded it on this tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write # deploy-pages proves the run to Pages over OIDC
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
