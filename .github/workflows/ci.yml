# llm-ports' own gate. Every job starts from `permissions: {}` and grants only what it needs.
#
#   lint         ruff check + ruff format --check, vulture (dead code), pre-commit (all files),
#                actionlint + zizmor over the workflows
#   types        mypy --strict over the package; pyright --verifytypes: every public name fully typed
#   pytest       the locked suite on 3.12 / 3.13 / 3.14 / 3.15 (ubuntu) and 3.13 (windows), with a
#                coverage floor (pyproject `[tool.coverage.report] fail_under`, raised only); one leg
#                uploads to Codecov over OIDC. It runs every `examples/` script and every Python
#                block in README.md and docs/ (tests/examples, pytest-examples).
#   test-lowest  every direct dependency at its declared lower bound (`--resolution lowest-direct`)
#   core-only    `pip install llm-ports` with no extra imports its whole core and no vendor; each
#                adapter names its install line; then `[http]` alone is enough for the HTTP adapters
#   build        sdist + wheel, `twine check --strict`
#   docs         `mkdocs build --strict` (a broken link or unreadable docstring fails); on a `v*` tag
#                it uploads the site for release.yml's `pages` job
#   test         the one required check: green only when every job above is
#   gitleaks / dup-code   ci-kit's reusable workflows, called the way every consumer calls them
#
# release.yml calls this whole workflow (`workflow_call`) before it builds anything to publish.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --group lint
      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .
      - name: ruff format
        run: uv run --no-sync ruff format --check .
      - name: vulture
        run: uv run --no-sync vulture
      - name: pre-commit
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
      - name: actionlint
        run: uv run --no-sync actionlint
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }} # online audits (impostor commits, known-vulnerable actions)
        run: uv run --no-sync zizmor --format=github .

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --group types
      - name: mypy --strict
        run: uv run --no-sync mypy
      - name: pyright --verifytypes
        run: uv run --no-sync pyright --verifytypes llm_ports --ignoreexternal

  pytest:
    name: pytest (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no stored token
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
        include:
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - name: pytest
        run: uv run --no-sync pytest -q --cov --cov-report=term --cov-report=xml
      - name: codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: true

  test-lowest:
    name: test-lowest (lowest-direct, 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      # `all` is every extra but lettucedetect, which pulls torch; its tests run over a stub detector.
      - run: uv venv
      - run: uv pip install --resolution lowest-direct -e ".[all]" --group dev
      - run: uv pip list
      - name: pytest
        run: .venv/bin/python -m pytest -q

  core-only:
    name: core-only (no extras, 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      # A plain (non-editable) install, so the test imports the wheel's package, not the checkout.
      - run: uv venv
      - run: uv pip install . pytest
      - name: core imports, no extra
        run: .venv/bin/python -m pytest -q -p no:cacheprovider tests/contract/test_core_imports.py
      - run: uv pip install ".[http]"
      - name: core imports, `http` only
        run: .venv/bin/python -m pytest -q -p no:cacheprovider tests/contract/test_core_imports.py

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: twine check
        run: uv run --frozen --only-group lint twine check --strict dist/*

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false # this job's output is what a tag publishes
      - run: uv sync --frozen --group docs
      - name: mkdocs build --strict
        run: uv run --no-sync mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      # Only a release tag publishes; release.yml's `pages` job deploys this artifact.
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  # The required status check is named `test`; it aggregates every job above so a new leg is
  # covered without editing branch protection.
  test:
    name: test
    if: always()
    needs: [lint, types, pytest, test-lowest, core-only, build, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  gitleaks:
    name: gitleaks (secret scan)
    permissions:
      contents: read
      pull-requests: read
    uses: mjdevaccount/ci-kit/.github/workflows/gitleaks.yml@v1
    with:
      mode: history

  # The same code written twice fails the PR: ci-kit's `ci-dup-code` (jscpd behind a shrink-only
  # fingerprint baseline, .github/jscpd-baseline.json). A NEW clone >= 70 tokens / 7 lines between two
  # tracked files fails; a removed one may re-freeze smaller (`--write-baseline` refuses to grow).
  # Reports as "dup-code / lint".
  dup-code:
    permissions:
      contents: read
    uses: mjdevaccount/ci-kit/.github/workflows/dup-code.yml@v1
    with:
      args: --baseline .github/jscpd-baseline.json
