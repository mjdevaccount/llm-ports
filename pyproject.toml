[project]
name = "llm-ports"
version = "0.10.0"
description = "Thin Protocols for LLM work (Generator, Embedder, Tracer, PromptSource, Judge, ...) and the one call path around them: roles from a tier table, prompt packs with a frozen content sha, per-call graders, named outcomes. Frameworks live behind the ports; pydantic-ai is the first adapter."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-ai-slim[openai]>=2.57,<3",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# `pydantic_evals_judge` (the Judge on pydantic-evals' LLMJudge). pydantic-evals pins
# pydantic-ai-slim to its own version, so it moves with the core dependency above.
evals = ["pydantic-evals>=2.57,<3"]
# `lettucedetect_grounder` with the REAL model (torch + transformers, hundreds of MB). The module
# imports it lazily; without the extra it runs over an injected detector (`testing.StubDetector`).
lettucedetect = ["lettucedetect>=0.1.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_ports"]

[dependency-groups]
# pydantic-evals: the judge adapter's tests run in CI (the `evals` extra's one package). lettucedetect
# is NOT here: its tests run over `testing.StubDetector`, the real model is the consumer's lane.
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.15", "pydantic-evals>=2.57,<3"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF002", "RUF022"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
