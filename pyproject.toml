[project]
name = "llm-ports"
version = "1.9.1"
description = "Thin Protocols for LLM work (Generator, Embedder, Reranker, Tracer, PromptSource, Judge, ...) and the one call path around them: roles from a tier table, prompt packs with a frozen content sha, per-call graders, named outcomes. Frameworks live behind the ports; pydantic-ai is the first adapter."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["llm", "ports-and-adapters", "hexagonal-architecture", "grounding", "pydantic", "pydantic-ai", "evals", "observability"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# The core (ports, call path, grounding, prompts, evals, rag, provenance, testing stubs) needs only
# these three. Every framework is an extra; `tests/contract/test_core_imports.py` holds the line.
dependencies = [
    "pydantic>=2.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/mjdevaccount/llm-ports"
Repository = "https://github.com/mjdevaccount/llm-ports"
Issues = "https://github.com/mjdevaccount/llm-ports/issues"
Changelog = "https://github.com/mjdevaccount/llm-ports/blob/main/CHANGELOG.md"
Decisions = "https://github.com/mjdevaccount/llm-ports/tree/main/docs/adr"

[project.optional-dependencies]
# `adapters.pydantic_ai`: the Generator, the Embedder, output schemas and record/replay. httpx2 is
# named, not inherited: the adapter builds its own `httpx2.AsyncClient` (ADR-0009); its floor is
# the OpenAI SDK 3's (`openai` requires `httpx2>=2.12`). httpx stays for `IndexOrderedTransport` and a legacy transport.
# tenacity carries the embedder's per-request retry (`RetryPolicy`).
pydantic-ai = ["pydantic-ai-slim[openai]>=2.57,<3", "httpx2>=2.12", "httpx>=0.27", "tenacity>=8.2"]
# `adapters.http`: the reranker, the grounder client and the index-ordered transport.
http = ["httpx>=0.27"]
# `adapters.pydantic_evals` (the Judge on pydantic-evals' LLMJudge). pydantic-evals pins
# pydantic-ai-slim to its own version, so it moves with the `pydantic-ai` extra.
evals = ["pydantic-evals>=2.57,<3"]
# `adapters.lettucedetect` with the REAL model (torch + transformers, hundreds of MB). The module
# imports it lazily; without the extra it runs over an injected detector (`testing.StubDetector`).
lettucedetect = ["lettucedetect>=0.1.6"]
# `adapters.langfuse.tracer` (the Tracer on the Langfuse SDK 5, OpenTelemetry underneath) and the
# `testing.langfuse` rig. `adapters.langfuse.prompt_source` duck-types the client and needs no SDK.
langfuse = ["langfuse>=5.0.2,<6"]
# `adapters.otel` (GenAI spans; the attribute names are the semantic-conventions package's constants).
otel = ["opentelemetry-api>=1.30", "opentelemetry-semantic-conventions>=0.58b0"]
# `adapters.sqlglot` (the read-only AST guard for agent-written SQL).
sql = ["sqlglot>=30.22"]
# Every extra but `lettucedetect`, whose model weighs hundreds of MB.
all = ["llm-ports[pydantic-ai,http,evals,langfuse,otel,sql]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_ports"]

[dependency-groups]
# Every extra's packages but lettucedetect's, so every adapter's tests run in CI (all pure Python).
# lettucedetect is NOT here: its tests run over `testing.StubDetector`; the real model is the
# consumer's lane.
dev = [
    "pydantic-ai-slim[openai]>=2.57,<3",
    "httpx2>=2.12",
    "httpx>=0.27",
    "tenacity>=8.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.15",
    "pydantic-evals>=2.57,<3",
    "langfuse>=5.0.2,<6",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-semantic-conventions>=0.58b0",
    "sqlglot>=30.22",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.7",
    "import-linter>=2.15",
    "pytest-examples>=0.0.18",
]
docs = [
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
]
lint = [
    "actionlint-py==1.7.12.25",
    "twine>=7.0",
    "vulture>=2.14",
    "zizmor==1.32.0",
]
# `mypy --strict` and `pyright --verifytypes` (the `types` CI job), with the stubs mypy reads.
types = [
    "mypy>=2.4",
    "pyright[nodejs]>=1.1.414",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "D"]
# D105/D107: magic methods and `__init__` are documented on the class (Google style).
ignore = ["E501", "RUF002", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstring rules are for the package; tests, examples and markdown snippets are read as code.
"tests/**" = ["D"]
"*.md" = ["D"]
"examples/**" = ["D"]

# The layers, bottom-up (docs/REDESIGN.md §1). `|` separates siblings that may not import each
# other. tests/contract/test_layers.py runs these contracts, so every pytest leg enforces them.
[tool.importlinter]
root_package = "llm_ports"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "layers: adapters | testing > evals | rag | provenance > call > grounding | prompts | observability > ports | learn"
type = "layers"
containers = ["llm_ports"]
layers = [
    "adapters | testing",
    "evals | rag | provenance",
    "call",
    "grounding | prompts | observability",
    "ports | learn",
]

[[tool.importlinter.contracts]]
id = "learn-standalone"
name = "learn imports nothing else from llm_ports (it can be lifted into any codebase)"
type = "forbidden"
source_modules = ["llm_ports.learn"]
forbidden_modules = [
    "llm_ports.adapters",
    "llm_ports.call",
    "llm_ports.evals",
    "llm_ports.grounding",
    "llm_ports.observability",
    "llm_ports.ports",
    "llm_ports.prompts",
    "llm_ports.provenance",
    "llm_ports.rag",
    "llm_ports.testing",
    "llm_ports._extras",
]

[[tool.importlinter.contracts]]
id = "adapter-independence"
name = "adapters do not import each other"
type = "independence"
modules = [
    "llm_ports.adapters.http",
    "llm_ports.adapters.langfuse",
    "llm_ports.adapters.lettucedetect",
    "llm_ports.adapters.otel",
    "llm_ports.adapters.pydantic_ai",
    "llm_ports.adapters.pydantic_evals",
    "llm_ports.adapters.sqlglot",
]

[[tool.importlinter.contracts]]
id = "no-vendor-in-core"
name = "only adapters and testing import a vendor library"
type = "forbidden"
source_modules = [
    "llm_ports.call",
    "llm_ports.evals",
    "llm_ports.learn",
    "llm_ports.grounding",
    "llm_ports.observability",
    "llm_ports.ports",
    "llm_ports.prompts",
    "llm_ports.provenance",
    "llm_ports.rag",
]
forbidden_modules = [
    "httpx",
    "httpx2",
    "langfuse",
    "lettucedetect",
    "opentelemetry",
    "pydantic_ai",
    "pydantic_evals",
    "sqlglot",
    "tenacity",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A deprecation raised at a call this package makes fails the suite (ADR-0009). Both categories:
# pydantic-ai and httpx2 deprecate with a `UserWarning` subclass so the warning shows by default.
# The module field is the frame the warning is attributed to, i.e. our call site.
filterwarnings = [
    "error::DeprecationWarning:llm_ports",
    "error::UserWarning:llm_ports",
]

# Types: the `types` CI job runs `mypy` (strict, over the package) and `pyright --verifytypes`
# (the public surface fully typed). A vendor that ships no type information is listed here.
[tool.mypy]
files = ["src"]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["lettucedetect.*"]
ignore_missing_imports = true

# Dead code: `vulture` runs in the `lint` job over the package and its tests (tests count as use).
# What it cannot see used: pydantic validators, a Protocol's parameter names, dataclass fields read
# by consumers, a fake client's attributes, and a pydantic-ai validator registered by decorator.
[tool.vulture]
paths = ["src", "tests"]
min_confidence = 60
ignore_decorators = ["@field_validator", "@model_validator", "@*.output_validator"]
ignore_names = [
    "date_from", "date_to", "question", "extras", "model_config", "output_schema", "langfuse_label", "create_score",
    # fields of test models that exist to shape a schema
    "confidence", "conviction", "entry_low", "hedge", "stop", "summary", "thesis", "ticker", "tickers",
]

[tool.coverage.run]
# By import name: a stray `llm_ports/` directory in the checkout can never shadow the package.
source_pkgs = ["llm_ports"]
branch = true

[tool.coverage.report]
# The floor is the measured branch-coverage total; raise it when coverage rises, never lower it.
fail_under = 97.1
precision = 1
